apiVersion: 1

datasources:

  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      httpMethod: POST
      # Link Prometheus exemplars to Jaeger traces
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Link Loki log lines to Jaeger traces via traceID field
      derivedFields:
        - matcherRegex: '"traceID":"([a-f0-9]+)"'
          name: traceID
          url: '$${__value.raw}'
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
    isDefault: false