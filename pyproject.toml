[project]
name = "capstone-project"
version = "0.1.0"
description = "A blockchain-based AI provenance system."
requires-python = "==3.11.*"
dependencies = [
    "numpy<2.0.0",
    "requests>=2.33.1",
    "torch>=2.2.2",
    "torchvision>=0.17.2",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]
